# ============================================================
# Browser Automation Studio — docker-compose.yml
# Local development launcher
# Usage: docker-compose up --build
# ============================================================

services:
  automation-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browser-automation-studio

    ports:
      - "7860:7860"             # FastAPI + React UI
      - "6080:6080"             # noVNC web viewer
      - "5900:5900"             # Raw VNC (optional)
      - "127.0.0.1:9222:9222"  # Chrome DevTools — localhost only

    env_file:
      - .env

    volumes:
      - ./data:/data
      - ./backend:/app/backend  # hot-reload backend only
      # frontend/src not mounted — React is pre-built in image

    restart: unless-stopped

    shm_size: '2gb'

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DISPLAY=:99
      - CHROME_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

    # deploy.resources is Swarm-only — use these for plain compose
    mem_limit: 4g
    mem_reservation: 1g