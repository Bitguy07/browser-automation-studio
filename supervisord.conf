# ============================================================
# Browser Automation Studio — supervisord.conf
# HF Spaces compatible:
#   - socket/pid in /tmp (writable by USER 1000)
#   - Chrome user-data-dir → /data/chrome-profile (bucket-persistent)
#   - ALL python commands use /opt/venv/bin/python explicitly
#     (never bare "python3" which hits read-only system Python)
#   - stdout → /dev/stdout so HF Logs tab shows live output
# ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── 1. Xvfb — Virtual Framebuffer Display ────────────────────
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
startsecs=2
priority=100
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=HOME="/home/appuser"

# ── 2. Google Chrome ──────────────────────────────────────────
# All flags on ONE line (supervisord does not support line continuation)
[program:chromium]
command=/usr/bin/google-chrome-stable --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 --user-data-dir=/data/chrome-profile --window-size=1280,720 --disable-notifications --disable-popup-blocking --disable-infobars --disable-translate --no-first-run --no-default-browser-check --disable-default-apps --test-type --disable-features=InfiniteSessionRestore --start-maximized https://www.google.com
autostart=true
autorestart=true
startsecs=5
priority=200
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=DISPLAY=":99",HOME="/home/appuser"
startretries=5

# ── 3. x11vnc — Screen Capture → VNC Stream ──────────────────
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -listen 127.0.0.1 -xkb
autostart=true
autorestart=true
startsecs=3
priority=300
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=DISPLAY=":99",HOME="/home/appuser"
startretries=5

# ── 4. websockify — VNC → WebSocket Bridge ───────────────────
# Uses /opt/venv/bin/python explicitly — same venv as everything else
[program:websockify]
command=/opt/venv/bin/python -m websockify --web=/opt/novnc 6080 localhost:5900
autostart=true
autorestart=true
startsecs=5
priority=400
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
startretries=5

# ── 5. FastAPI Backend ────────────────────────────────────────
# Uses /opt/venv/bin/python explicitly
# No --reload (production safe, saves RAM)
[program:fastapi]
command=/opt/venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 7860 --log-level info
directory=/app
autostart=true
autorestart=true
startsecs=5
priority=500
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app",DISPLAY=":99",HOME="/home/appuser"
startretries=5

# ── 6. Telegram Bot ───────────────────────────────────────────
# startsecs=10 so FastAPI is ready before bot's JWT login attempt
# Uses /opt/venv/bin/python explicitly
[program:telegram-bot]
command=/opt/venv/bin/python /app/backend/telegram_bot.py
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=10
priority=600
stdout_logfile=/var/log/supervisor/telegram.log
stderr_logfile=/var/log/supervisor/telegram.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONPATH="/app",HOME="/home/appuser"