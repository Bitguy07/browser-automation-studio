# ============================================================
# Browser Automation Studio — supervisord.conf
# M2: All commands single-line (multiline \ breaks supervisord)
#     Chromium uses google-chrome-stable via /usr/bin/chromium symlink
#     websockify uses python3 -m for correct --web flag support
# ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── 1. Log directory setup ────────────────────────────────────
[program:log-setup]
command=/bin/bash -c "mkdir -p /var/log/supervisor && echo 'Log dirs ready'"
autostart=true
autorestart=false
startsecs=0
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 2. Xvfb — Virtual Framebuffer Display ────────────────────
# Creates virtual screen :99 at 1280x720, 24-bit color
# Chrome draws here. x11vnc captures from here.
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
startsecs=2
priority=100
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=HOME="/root"

# ── 3. Chromium Browser ───────────────────────────────────────
# Uses google-chrome-stable via /usr/bin/chromium symlink
# --remote-debugging-port=9222: enables Chrome DevTools Protocol (CDP)
# CDP is used by: screenshot API, Selenium (M5), Browser Use (M5)
# Single-line command required — supervisord breaks on backslash continuation
[program:chromium]
command=/usr/bin/chromium --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 --user-data-dir=/root/.chrome-data --window-size=1280,720 --disable-notifications --disable-popup-blocking --disable-infobars --disable-translate --no-first-run --no-default-browser-check --disable-default-apps --test-type --disable-features=InfiniteSessionRestore --start-maximized https://www.google.com
autostart=true
autorestart=true
startsecs=5
priority=200
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=DISPLAY=":99",HOME="/root"
startretries=5

# ── 4. x11vnc — Screen Capture → VNC Stream ──────────────────
# Watches virtual display :99
# Streams it as VNC on port 5900 (localhost only)
# -forever: stays running when noVNC client disconnects
# -shared: multiple noVNC tabs can watch simultaneously
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -listen 127.0.0.1 -xkb
autostart=true
autorestart=true
startsecs=3
priority=300
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=DISPLAY=":99",HOME="/root"
startretries=5

# ── 5. websockify — VNC → WebSocket Bridge ───────────────────
# Converts raw VNC (port 5900) to WebSocket (port 6080)
# noVNC running in the browser speaks WebSocket not raw VNC
# --web=/opt/novnc: also serves noVNC HTML/JS files directly
# Access: http://localhost:6080/vnc.html
[program:websockify]
command=/usr/bin/python3 -m websockify --web=/opt/novnc 6080 localhost:5900
autostart=true
autorestart=true
startsecs=5
priority=400
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
startretries=5

# ── 6. FastAPI Backend ────────────────────────────────────────
# API server + serves React (M4) + proxies /vnc path
# Port 7860: required by Hugging Face Spaces
# noVNC also accessible at: http://localhost:7860/vnc/vnc.html
[program:fastapi]
command=/opt/venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 7860 --log-level info --reload
directory=/app
autostart=true
autorestart=true
startsecs=5
priority=500
stdout_logfile=/var/log/supervisor/fastapi.log
stderr_logfile=/var/log/supervisor/fastapi.err
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
environment=PYTHONPATH="/app",DISPLAY=":99"
startretries=5

# ── 7. Telegram Bot ───────────────────────────────────────────
# Stub in M1/M2 — implemented in M6
# autorestart=false: empty stub exits cleanly, no need to retry
[program:telegram-bot]
command=/opt/venv/bin/python /app/backend/telegram_bot.py
directory=/app
autostart=true
autorestart=false
startsecs=0
priority=600
stdout_logfile=/var/log/supervisor/telegram.log
stderr_logfile=/var/log/supervisor/telegram.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONPATH="/app"