# ============================================================
# Browser Automation Studio — supervisord.conf
# M7: Chrome --user-data-dir=/data/chrome-profile (persistent HF volume)
#
# CHANGES vs previous version:
#   1. [supervisord] logfile → /tmp/ (UID 1000 can't write /var/log)
#   2. [supervisord] removed "user=root" (container runs as UID 1000)
#   3. All log paths changed from /var/log/supervisor/ → /data/logs/
#      (/data is chown'd to appuser 1000 in Dockerfile)
#   4. [program:chromium] --user-data-dir changed from /root/.chrome-data
#      → /data/chrome-profile (UID 1000 owns /data, not /root)
#   5. [program:chromium] environment HOME changed from /root → /home/appuser
#   6. [program:xvfb] environment HOME changed from /root → /home/appuser
#   7. [program:x11vnc] environment HOME changed from /root → /home/appuser
#   8. [program:log-setup] removed (mkdir now handled in start.sh, not needed)
#   9. FastAPI logs → /dev/fd/1 so HF can capture them in the UI
#  10. Chrome/VNC/Telegram set to autostart=false, started by delayed_start.sh
#      to avoid OOM on HF Free Tier 16GB
# ============================================================

[supervisord]
user=appuser
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── 1. Xvfb — Virtual Framebuffer Display ────────────────────
# Creates virtual screen :99 at 1280x720, 24-bit color.
# Chrome draws here. x11vnc captures from here.
# Starts immediately — lightweight, no memory concern.
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
startsecs=2
priority=100
stdout_logfile=/data/logs/xvfb.log
stderr_logfile=/data/logs/xvfb.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=HOME="/home/appuser"

# ── 2. FastAPI Backend ────────────────────────────────────────
# API server + serves React build + proxies /vnc path.
# Port 7860: required by Hugging Face Spaces.
# PRIORITY 200 — starts FIRST (after Xvfb) so health check passes.
# Logs go to /dev/fd/1 (stdout) so HF can display them.
[program:fastapi]
command=/opt/venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 7860 --log-level info
directory=/app
autostart=true
autorestart=true
startsecs=5
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app",DISPLAY=":99"
startretries=5

# ── 3. Ollama Server ──────────────────────────────────────────
# Runs Ollama daemon. Model pull is handled by ollama-pull program.
# Starts early so model pull can begin ASAP.
[program:ollama]
command=/usr/local/bin/ollama serve
autostart=true
autorestart=true
startsecs=5
priority=300
stdout_logfile=/data/logs/ollama.log
stderr_logfile=/data/logs/ollama.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=OLLAMA_MODELS="/data/ollama",OLLAMA_HOST="127.0.0.1:11434",HOME="/home/appuser"

# ── 4. Chromium Browser ───────────────────────────────────────
# --user-data-dir=/data/chrome-profile is the persistent HF Storage
# Bucket mount. All cookies, localStorage, and login sessions survive
# container restarts automatically.
#
# autostart=false — started by delayed_start.sh AFTER FastAPI is healthy
# to prevent memory spike that causes HF to pause the container.
[program:chromium]
command=/usr/bin/google-chrome-stable --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 --user-data-dir=/data/chrome-profile --window-size=1280,720 --disable-notifications --disable-popup-blocking --disable-infobars --disable-translate --no-first-run --no-default-browser-check --disable-default-apps --test-type --disable-features=InfiniteSessionRestore --start-maximized https://www.google.com
autostart=false
autorestart=true
startsecs=5
priority=400
stdout_logfile=/data/logs/chromium.log
stderr_logfile=/data/logs/chromium.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=DISPLAY=":99",HOME="/home/appuser"
startretries=5

# ── 5. x11vnc — Screen Capture → VNC Stream ──────────────────
# Watches virtual display :99, streams as VNC on port 5900.
# autostart=false — started by delayed_start.sh after Chrome.
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -listen 127.0.0.1 -xkb
autostart=false
autorestart=true
startsecs=3
priority=500
stdout_logfile=/data/logs/x11vnc.log
stderr_logfile=/data/logs/x11vnc.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=DISPLAY=":99",HOME="/home/appuser"
startretries=5

# ── 6. websockify — VNC → WebSocket Bridge ───────────────────
# Converts raw VNC (port 5900) to WebSocket (port 6080).
# autostart=false — started by delayed_start.sh after x11vnc.
[program:websockify]
command=/usr/bin/python3 -m websockify --web=/opt/novnc 6080 localhost:5900
autostart=false
autorestart=true
startsecs=5
priority=600
stdout_logfile=/data/logs/websockify.log
stderr_logfile=/data/logs/websockify.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
startretries=5

# ── 7. Telegram Bot ───────────────────────────────────────────
# autostart=false — started by delayed_start.sh only if token is set.
[program:telegram-bot]
command=/opt/venv/bin/python /app/backend/telegram_bot.py
directory=/app
autostart=false
autorestart=true
startsecs=10
startretries=10
priority=700
stdout_logfile=/data/logs/telegram.log
stderr_logfile=/data/logs/telegram.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONPATH="/app"

# ── 8. Ollama Model Pull (one-shot) ───────────────────────────
# Waits for Ollama, checks persistent storage, pulls model if needed.
# autorestart=false: runs once and exits.
[program:ollama-pull]
command=/app/scripts/pull_model.sh
directory=/app
autostart=true
autorestart=false
startsecs=0
startretries=3
priority=800
stdout_logfile=/data/logs/ollama-pull.log
stderr_logfile=/data/logs/ollama-pull.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=OLLAMA_MODELS="/data/ollama",OLLAMA_HOST="127.0.0.1:11434",HOME="/home/appuser"

# ── 9. Delayed Start (one-shot) ──────────────────────────────
# Waits for FastAPI health check, then starts Chrome/VNC/Telegram.
# This prevents the memory spike from killing the container on HF.
[program:delayed-start]
command=/app/scripts/delayed_start.sh
directory=/app
autostart=true
autorestart=false
startsecs=0
startretries=1
priority=900
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0