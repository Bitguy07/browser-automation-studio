name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # Create a fresh orphan branch with only current files
          # This completely avoids any binary files buried in old commits
          git checkout --orphan hf-deploy
          git add .
          git commit -m "Deploy to HF Space"

          # Add HF remote
          git remote add hf \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"

          # Push the clean single-commit branch to HF main
          git push hf hf-deploy:main --force

          echo "✅ Pushed to https://huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
